<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Schneaggchat V3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- FAQ Section -->
    <section class="faq-page">
        <div class="faq-container">
            <h1 class="section-title" data-i18n="faq_title">Häufige Fragen</h1>
            <p class="section-subtitle" data-i18n="faq_subtitle">
                Antworten auf die Fragen, die uns am häufigsten gestellt werden. Ist deine Frage nicht dabei,
                schreib uns einfach.
            </p>

            <!-- Categories and entries are loaded from the database -->
            <div id="faq-categories"></div>

            <p id="faq-empty" class="update-info hidden" data-i18n="faq_empty">
                Hier stehen bald Antworten. Schau später nochmal vorbei.
            </p>

            <div class="faq-contact">
                <i class="fa-solid fa-envelope"></i>
                <div>
                    <h3 data-i18n="faq_contact_heading">Frage nicht dabei?</h3>
                    <p data-i18n="faq_contact_text">
                        Schreib uns an <a href="mailto:schneaggchat@gmail.com">schneaggchat@gmail.com</a>,
                        wir antworten so schnell wir können.
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Script to populate header and footer -->
    <script src="/js/header_footer.js"></script>

    <!-- Script to load and render the FAQ entries -->
    <script src="/js/faq.js"></script>
</body>

</html>
