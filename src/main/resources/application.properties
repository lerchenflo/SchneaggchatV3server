spring.application.name=schneaggchatv3server

#logging
logging.pattern.console=%d{HH:mm:ss} %p %c - %m%n
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.core.env=ERROR
logging.level.org.springframework.boot.context.config=ERROR

#Always print the error message in the response
spring.web.error.include-message=always

#Mongodb config
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.mongodb.database=db
spring.data.mongodb.auto-index-creation=true

#Json web token
jwt.secret=${JWT_SECRET}

#Password for Google play test account
defaultaccount.password=${DEFAULTACCOUNT_PASSWORD}

#Email for email verification etc
spring.mail.test-connection=false
spring.mail.username=${EMAIL}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#APNs config
apns.team-id=${APNS_TEAM_ID}
apns.key-id=${APNS_KEY_ID}
apns.bundle-id=${APNS_BUNDLE_ID}
apns.debug=${APNS_DEBUG:false}

#Redis
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2s

#Rate limiting
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.ip.capacity=100
rate-limit.ip.refill-period=PT1M
rate-limit.user.capacity=300
rate-limit.user.refill-period=PT1M
rate-limit.auth.capacity=10
rate-limit.auth.refill-period=PT1M
rate-limit.auth-path-prefix=/auth/


#Prometheus logging
prometheus.key=${PROMETHEUS_KEY}
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.access=none
#management.endpoint.heapdump.access=none
#management.endpoint.threaddump.access=none
